# Informa ao Spring o endereço JDBC do banco PostgreSQL.
# Porta, banco, usuário e senha são os mesmos do docker-compose.yml: mudou lá, mude aqui.
spring.datasource.url=jdbc:postgresql://localhost:5437/projeto
# Informa o usuário usado para abrir a conexão com o banco.
spring.datasource.username=projeto
# Informa a senha usada para abrir a conexão com o banco.
spring.datasource.password=projeto

# Mantém a atualização de schema já usada pelo projeto (não é apenas validação).
# As migrations criam a base; o adaptador JDBC impede recriar os tipos de enum.
spring.jpa.hibernate.ddl-auto=update
# Mostra no console o SQL que o Repository dispara por meio do Hibernate.
spring.jpa.show-sql=true
# Evita manter uma sessão JPA aberta durante toda a requisição web.
spring.jpa.open-in-view=false

# Liga a execução automática das migrations no startup da aplicação.
spring.flyway.enabled=true

# ---------------------------------------------------------------- Swagger (Aula 09)
# Endereço do contrato OpenAPI em JSON -- é este arquivo que o Postman importa.
springdoc.api-docs.path=/v3/api-docs
# Endereço da página do Swagger UI (redireciona para /swagger-ui/index.html).
springdoc.swagger-ui.path=/swagger-ui.html
# Sem esta linha, o Swagger mostra as respostas como "*/*"; a API só devolve JSON.
springdoc.default-produces-media-type=application/json
# Abre cada endpoint já no modo "Try it out", pronto para enviar a requisição.
springdoc.swagger-ui.try-it-out-enabled=true
# Ordena os grupos (tags) e, dentro deles, os endpoints pelo método HTTP.
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method

# No container, a porta vem do ambiente. A execução Maven local continua em 8080.
server.port=${PORT:8080}

# Origens exatas, separadas por vírgula; configure a URL publicada do frontend.
# Sem configuração externa, mantêm-se as duas origens locais de desenvolvimento.
ec.cors.allowed-origins=${EC_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
