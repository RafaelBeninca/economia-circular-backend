<!doctype html>
<html lang="pt-BR" data-palette="teal">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Conheça o saldo e o valor dos resíduos de produção. Economia Circular: cada sobra tem valor."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;450;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Estoque · Economia Circular</title>
    <script>
      // Aplica o tema antes da primeira pintura para evitar um flash de cor.
      try {
        const tema = localStorage.getItem("ec-tema");
        const escuro =
          tema === "escuro" ||
          (!tema && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark-theme", escuro);
      } catch {
        document.documentElement.classList.toggle(
          "dark-theme",
          matchMedia("(prefers-color-scheme: dark)").matches,
        );
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
